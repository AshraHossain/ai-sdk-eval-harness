name: Live eval

# Manual only: calls real providers and spends tokens.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per case (N)
        default: "3"
      suites:
        description: Comma-separated suites (blank = all)
        default: ""
      model:
        description: "Model under test (provider:model; anthropic, openai, bynara, openrouter, nim or vertex)"
        default: "anthropic:claude-haiku-5-5"
      judge_model:
        description: "Judge model (provider:model)"
        default: "anthropic:claude-sonnet-5-5"

permissions:
  contents: read

# Never cancel a live run that has already spent tokens.
concurrency:
  group: live-eval
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    env:
      EVAL_MODE: live
      EVAL_MODEL: ${{ inputs.model }}
      EVAL_JUDGE_MODEL: ${{ inputs.judge_model }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BYNARA_API_KEY: ${{ secrets.BYNARA_API_KEY }}
      BYNARA_BASE_URL: ${{ vars.BYNARA_BASE_URL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_BASE_URL: ${{ vars.OPENROUTER_BASE_URL }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NIM_BASE_URL: ${{ vars.NIM_BASE_URL }}
      # vertex: add a google-github-actions/auth step (Workload Identity Federation) before using vertex models.
      GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
      GOOGLE_CLOUD_LOCATION: ${{ vars.GOOGLE_CLOUD_LOCATION }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Judge calibration (fails if the live judge disagrees with human labels)
        run: npm run eval:calibrate
      - name: Run live eval gate
        env:
          SUITES: ${{ inputs.suites }}
          RUNS: ${{ inputs.runs }}
        run: |
          args=()
          IFS=',' read -ra picked <<< "$SUITES"
          for s in "${picked[@]}"; do [ -n "$s" ] && args+=(--suite "$s"); done
          npx tsx evals/cli.ts --mode live --runs "$RUNS" "${args[@]}"
      - name: Publish summary
        if: always()
        run: |
          if [ -f reports/summary.md ]; then cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: live-eval-reports
          path: reports/
          if-no-files-found: ignore
