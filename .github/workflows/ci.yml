name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: lint · typecheck · unit · eval gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Runtime dependencies must be clean. Dev-only advisories are tracked in SECURITY.md.
      - name: Dependency audit (runtime)
        run: npm audit --omit=dev --audit-level=moderate
      # Mock judge: a plumbing check that reports agreement but never fails CI.
      - name: Judge calibration (mock, report only)
        run: npm run eval:calibrate
      # make check = lint (0 warnings, incl. eslint-plugin-security) + typecheck
      #   + unit/integration tests with a per-file 95% coverage gate
      #   + gate self-test (every injected fault must fail the gate)
      #   + offline eval gate (fixtures + mock judge, no API keys) -> reports/summary.md + scorecard.json
      - name: make check
        run: make check
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const t=require('./coverage/coverage-summary.json').total; console.log('| Coverage | %|\\n|---|---|'); for (const k of ['lines','statements','functions','branches']) console.log('| '+k+' | '+t[k].pct+' |')" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish summary
        if: always()
        run: |
          if [ -f reports/summary.md ]; then cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: reports/
          if-no-files-found: ignore
      - name: Comment on PR
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('reports/summary.md')) return;
            const marker = '<!-- eval-harness-summary -->';
            const body = marker + '\n' + fs.readFileSync('reports/summary.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

  e2e:
    name: playwright
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

  docker:
    name: container build + healthcheck
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ai-sdk-eval-harness:ci .
      - name: Run read-only, non-root, and wait for the HEALTHCHECK
        run: |
          docker run -d --name app -p 3000:3000 --read-only --tmpfs /app/reports:uid=10001,gid=10001 --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges:true ai-sdk-eval-harness:ci
          test "$(docker exec app id -u)" = "10001"
          for i in $(seq 1 30); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' app)" = healthy ] && break; sleep 2
          done
          docker inspect --format '{{.State.Health.Status}}' app | grep -q healthy
          curl -sf -X POST -H 'content-type: application/json' -d '{"suite":"classify","runs":1}' http://127.0.0.1:3000/api/eval
      - if: failure()
        run: docker logs app || true
